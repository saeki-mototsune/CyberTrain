# The bundled Japanese dictionary (plan decision D2): rails-i18n's
# rails/locale/ja.yml (https://github.com/svenfuchs/rails-i18n, commit
# f5c999b88935d4c1389a1ffe8a00f29b43e10366, MIT License; the file as
# fetched and its license are in test/fixtures/i18n/rails-i18n/), cut to
# date, time, datetime.distance_in_words, number, errors,
# activerecord.errors.messages, helpers.submit and support.array; plus
# the framework's own keys under cybertrain (plan decision D12), and the
# screens `cybertrain generate authentication` writes: their lazy keys
# (sessions.*, registrations.*, setup.*, passwords.*, accounts.*,
# confirmations.*, the reset mail's mail.password_reset.* and
# passwords_mailer.reset.subject, the confirmation mail's
# mail.confirmation.* and confirmations_mailer.*) and the User
# model's attribute names (activerecord.attributes.user).
# Compiled into cybertrain/locales/bundled.rb by script/bundle-locales;
# an application's config/locales overrides any key.
---
ja:
  accounts:
    destroy:
      deleted: アカウントを削除しました。
      not_deleted: アカウントを削除できませんでした。何も変更していません。
      wrong_password: 現在のパスワードが違います。
    edit:
      delete: アカウントを削除する
      delete_intro: アカウントを削除し、すべての端末からログアウトします。元に戻すことはできません。
      delete_title: アカウントの削除
      model: アカウント
      new_password: 新しいパスワード
      password_hint: 変更しない場合は空欄のままにしてください。
      pending: '確認待ち: %{email_address}'
      submit: 変更を保存
      title: アカウント
    update:
      confirm: 新しいメールアドレスに確認用のリンクを送りました。リンクを開くと、メールアドレスが変わります。
      rate_limited: しばらくしてからもう一度お試しください。
      updated: アカウントを更新しました。
      wrong_password: 現在のパスワードが違います。
  activerecord:
    attributes:
      user:
        current_password: 現在のパスワード
        email_address: メールアドレス
        password: パスワード
        password_confirmation: パスワード（確認用）
    errors:
      messages:
        record_invalid: 'バリデーションに失敗しました: %{errors}'
        restrict_dependent_destroy:
          has_one: "%{record}が存在しているので削除できません"
          has_many: "%{record}が存在しているので削除できません"
  confirmations:
    create:
      rate_limited: しばらくしてからもう一度お試しください。
      sent: そのメールアドレスが登録されていて未確認であれば、確認用のリンクを送りました。
    new:
      intro: 確認を待っているメールアドレスであれば、新しいリンクをメールで送ります。
      sign_in: ログイン
      submit: リンクを送る
      title: 確認用リンクの再送信
    show:
      confirmed: メールアドレスを確認しました。
      invalid: 確認用のリンクが無効か、期限が切れています。
      taken: そのメールアドレスは別のアカウントが使っているため、変更しませんでした。
  confirmations_mailer:
    confirmation_instructions:
      subject: メールアドレスの確認
  cybertrain:
    helpers:
      submit:
        no_model: 変更を保存
    jobs_page:
      buttons:
        delete: 削除
        discard: 破棄
        discard_all: 失敗したジョブをすべて破棄
        retry: 再実行
        retry_all: 失敗したジョブをすべて再実行
      columns:
        arguments: 引数
        attempts: 試行回数
        claimed_by: 実行ワーカー
        error: エラー
        heartbeat: 最終応答
        id: ID
        jobs: 件数
        kind: 種類
        run_at: 実行予定
        state: 状態
        updated: 更新日時
      empty:
        discarded: 破棄済みのジョブはありません。
        failed: 失敗したジョブはありません。
        running: 実行中のジョブはありません。
      heartbeat:
        ago: "%{seconds}秒前"
        none: なし
      notices:
        deleted: ジョブ %{id} を削除しました。
        discarded: ジョブ %{id} を破棄しました。
        discarded_all: 失敗したジョブ %{count}件を破棄しました。
        not_deleted: ジョブ %{id} は削除できません。失敗または破棄済みの状態ではありません。
        not_discarded: ジョブ %{id} は破棄できません。失敗または破棄済みの状態ではありません。
        not_retried: ジョブ %{id} は再実行できません。失敗または破棄済みの状態ではありません。
        retried: ジョブ %{id} を再びキューに入れました。
        retried_all: 失敗したジョブ %{count}件を再びキューに入れました。
