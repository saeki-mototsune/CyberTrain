# Builds the playground image (playground/Dockerfile, target playground) for
# linux/amd64, smoke-tests it (playground/smoke.sh) and pushes the tested
# image to GHCR: X.Y.Z and latest for a release tag vX.Y.Z, the given tag on
# a manual run. It runs from release.yml, which calls it (with release_tag)
# after the Gate, CI and the blog image have passed on the tag, and by hand
# (Actions -> Playground image -> Run workflow). A pull request runs it,
# without pushing, only when it touches what the image is built with
# (below): its own files, and the CLI, the toolchain checks, the pins and
# the gemspec, since the build runs `cybertrain setup && cybertrain doctor`
# and nothing else runs doctor on this image's package list. A change to the
# rest of the framework alone is tested by ci.yml and reaches the image at
# the next release. Pushes to main do not run it. See playground/README.md.
name: Playground image

on:
  pull_request:
    paths:
      - "playground/**"
      # Documentation only; PLAYGROUND.md is not, the image ships it.
      - "!playground/README.md"
      - ".devcontainer/**"
      - ".github/workflows/playground-image.yml"
      # The gem the image builds and runs (the Dockerfile's cli-src stage,
      # which is cybertrain.gemspec's spec.files) and the pins: the version
      # and the Spinel release in cybertrain/version.rb, the packages in
      # spin.toml.
      - "cybertrain.gemspec"
      - "spin.toml"
      - "exe/**"
      - "cybertrain/cli.rb"
      - "cybertrain/cli/**"
      - "cybertrain/version.rb"
      - "cybertrain/app_name.rb"
      - "cybertrain/shell.rb"
      - "cybertrain/ident.rb"
      - "cybertrain/crypto.rb"
      - "cybertrain/generator/inflector.rb"
  # From release.yml, after every check passed on the release tag.
  workflow_call:
    inputs:
      ref:
        description: "Commit to check out (default: the release tag)"
        type: string
        required: false
        default: ""
      release_tag:
        description: "Release tag vX.Y.Z to build, test and push as X.Y.Z and latest"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to push to ghcr.io/saeki-mototsune/cybertrain-playground (latest, X.Y.Z or a test name)"
        required: true
        default: "test"

permissions:
  contents: read
  packages: write

concurrency:
  group: playground-image-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/saeki-mototsune/cybertrain-playground

jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || (inputs.release_tag && format('refs/tags/{0}', inputs.release_tag)) || '' }}
          persist-credentials: false

      - name: The tag is v + Cybertrain::VERSION
        if: inputs.release_tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(sed -n 's/^ *VERSION = "\([^"]*\)".*/\1/p' cybertrain/version.rb | head -n 1)
          test "$RELEASE_TAG" = "v$version" || { echo "tag $RELEASE_TAG is not v$version (cybertrain/version.rb)"; exit 1; }

      - name: devcontainer.json is valid JSON
        run: jq empty .devcontainer/devcontainer.json

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{version}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=raw,value=${{ inputs.tag || 'manual' }},enable=${{ github.event_name == 'workflow_dispatch' && !inputs.release_tag }}

      - name: Build (linux/amd64, target playground)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: playground/Dockerfile
          target: playground
          platforms: linux/amd64
          load: true
          provenance: false
          tags: cybertrain-playground:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=playground-image
          cache-to: type=gha,mode=max,scope=playground-image,ignore-error=true

      - name: Smoke test
        run: bash playground/smoke.sh cybertrain-playground:ci

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          test -n "$TAGS" || { echo "no tag to push"; exit 1; }
          for tag in $TAGS; do
            docker tag cybertrain-playground:ci "$tag"
            docker push "$tag"
          done
