# Builds the playground image (playground/Dockerfile, target playground) for
# linux/amd64, smoke-tests it (playground/smoke.sh) and, except on pull
# requests, pushes the tested image to GHCR: latest from main, X.Y.Z and
# latest for a release tag vX.Y.Z, the given tag on a manual run.
# A release tag does not trigger this file: release.yml calls it (with
# release_tag) only after the Gate, CI and the blog image have passed on the
# tag, so a release image is pushed only for a tag whose checks all passed.
# A change to playground/README.md alone builds nothing (it is not in the
# image); see the paths below. See playground/README.md.
name: Playground image

on:
  pull_request:
    paths:
      - "playground/**"
      # Documentation only; PLAYGROUND.md is not, the image ships it.
      - "!playground/README.md"
      - ".devcontainer/**"
      - "cybertrain/**"
      - "cybertrain.rb"
      - "cybertrain.gemspec"
      - "spin.toml"
      - "exe/**"
      - ".github/workflows/playground-image.yml"
  push:
    branches: [main]
    paths:
      - "playground/**"
      # Documentation only; PLAYGROUND.md is not, the image ships it.
      - "!playground/README.md"
      - ".devcontainer/**"
      - "cybertrain/**"
      - "cybertrain.rb"
      - "cybertrain.gemspec"
      - "spin.toml"
      - "exe/**"
      - ".github/workflows/playground-image.yml"
  # From release.yml, after every check passed on the release tag.
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag vX.Y.Z to build, test and push as X.Y.Z and latest"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to push to ghcr.io/saeki-mototsune/cybertrain-playground (latest, X.Y.Z or a test name)"
        required: true
        default: "test"

permissions:
  contents: read
  packages: write

concurrency:
  group: playground-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/saeki-mototsune/cybertrain-playground

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}
          persist-credentials: false

      - name: The tag is v + Cybertrain::VERSION
        if: inputs.release_tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(sed -n 's/^ *VERSION = "\([^"]*\)".*/\1/p' cybertrain/version.rb | head -n 1)
          test "$RELEASE_TAG" = "v$version" || { echo "tag $RELEASE_TAG is not v$version (cybertrain/version.rb)"; exit 1; }

      - name: devcontainer.json is valid JSON
        run: jq empty .devcontainer/devcontainer.json

      - uses: docker/setup-buildx-action@v3

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.release_tag != '' }}
            type=semver,pattern={{version}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=raw,value=${{ inputs.tag || 'manual' }},enable=${{ github.event_name == 'workflow_dispatch' && !inputs.release_tag }}

      - name: Build (linux/amd64, target playground)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: playground/Dockerfile
          target: playground
          platforms: linux/amd64
          load: true
          provenance: false
          tags: cybertrain-playground:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=playground-image
          cache-to: type=gha,mode=max,scope=playground-image,ignore-error=true

      - name: Smoke test
        run: bash playground/smoke.sh cybertrain-playground:ci

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          test -n "$TAGS" || { echo "no tag to push"; exit 1; }
          for tag in $TAGS; do
            docker tag cybertrain-playground:ci "$tag"
            docker push "$tag"
          done
