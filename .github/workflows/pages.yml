# Publishes site/ (the project homepage and tutorial) to GitHub Pages, with
# the API reference built into site/api/ by script/api-docs (YARD) and the
# tutorial and guides built from docs/guide/ by script/guide-pages (which
# also writes site/api/file.*.html redirects from the old guide URLs, so it
# runs after script/api-docs).
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # Notes for contributors (site/README.md, assets/brand/BRAND.md): no
      # page links them, so a change to them alone deploys nothing.
      - "!site/**.md"
      - ".github/workflows/pages.yml"
      # The API reference's sources (see script/api-docs).
      - "cybertrain/**"
      - "docs/api/**"
      - "docs/guide/**"
      - ".yardopts"
      - "script/api-docs"
      # The guide pages' generator (see script/guide-pages).
      - "script/guide-pages"
      - "script/guide-pages.d/**"
      - "script/check-guide-i18n"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Build the API reference into site/api/
        run: |
          gem install --no-document yard kramdown kramdown-parser-gfm rouge
          script/api-docs
      - name: Build the guides
        run: |
          script/check-guide-i18n
          script/guide-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
