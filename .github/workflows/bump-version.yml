# Opens the pull request that moves main to the next release before it is
# tagged (CONTRIBUTING.md "Releasing", step 1). Run it by hand from the Actions
# tab with the new Cybertrain::VERSION and, if the framework moves to another
# Spinel release, the new Cybertrain::SPINEL_TAG (blank keeps the current one).
#
# It checks that the version has no tag yet and that the Spinel tag exists in
# Cybertrain::SPINEL_REPOSITORY, runs script/bump-version (cybertrain/version.rb,
# spin.toml, ci.yml's SPINEL_TAG and the tests' expected numbers) and pushes
# the result to release/bump-vX.Y.Z with a pull request against main. A second
# run for the same version updates that branch and the open pull request's
# title and body. The site and the guides name no release numbers
# (script/check-version-mentions), so they need no change.
#
# The Gate and CI must run on this pull request, above all when Spinel moves,
# but GitHub starts no workflows for a push or a pull request made with
# GITHUB_TOKEN. So the run needs the repository secret RELEASE_PR_TOKEN: a
# fine-grained personal access token for this repository with Contents, Pull
# requests and Workflows: read and write (Settings -> Secrets and variables
# -> Actions -> New repository secret). It pushes the branch and opens the
# pull request with that token, so the checks start. Workflows is needed
# because a Spinel bump changes .github/workflows/ci.yml, which GitHub
# refuses to take from a push without it. Without the secret, or with one
# GitHub no longer accepts, the run fails in its first step, before anything
# is pushed: there is no fallback to GITHUB_TOKEN, which would open a pull
# request that can be merged with no check ever run on it.
#
# After it has opened or updated the pull request, the run waits until the
# Gate and CI have started on the commit it pushed, and fails if they have
# not within three minutes: the pull request is then open but unchecked, and
# the error says so.
name: Bump version

on:
  workflow_dispatch:
    inputs:
      cybertrain_version:
        description: "New Cybertrain::VERSION (X.Y.Z)"
        required: true
        type: string
      spinel_tag:
        description: "New Cybertrain::SPINEL_TAG (a tag of the Spinel fork; blank keeps the current one)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

# One bump at a time: two runs would race on main's numbers.
concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # To see that the Gate and CI started on the pull request (last step).
      actions: read
    env:
      # Inputs reach the scripts only through the environment, never spliced
      # into a command line.
      VERSION_INPUT: ${{ inputs.cybertrain_version }}
      SPINEL_INPUT: ${{ inputs.spinel_tag }}
    steps:
      # First, before anything is checked out or pushed. Secrets cannot be
      # read in an `if:`, so the step looks at its environment.
      - name: RELEASE_PR_TOKEN is set and GitHub accepts it
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::the repository secret RELEASE_PR_TOKEN is not set. Create a fine-grained personal access token for this repository with Contents, Pull requests and Workflows: read and write, and save it as RELEASE_PR_TOKEN (Settings -> Secrets and variables -> Actions). GITHUB_TOKEN is not used instead: a pull request it opens starts neither the Gate nor CI."
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY" --jq .full_name > /dev/null; then
            echo "::error::GitHub does not accept RELEASE_PR_TOKEN for $GITHUB_REPOSITORY (expired, revoked, or not granted this repository). Replace the secret with a fine-grained token that has Contents, Pull requests and Workflows: read and write."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_PR_TOKEN }}
          # Kept: "Open the pull request" pushes the branch with this token.
          persist-credentials: true

      - name: Check the inputs
        id: inputs
        run: |
          version="${VERSION_INPUT#v}"
          version="$(printf '%s' "$version" | tr -d '[:space:]')"
          spinel="$(printf '%s' "$SPINEL_INPUT" | tr -d '[:space:]')"
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::cybertrain_version $VERSION_INPUT is not X.Y.Z"; exit 1; }
          if [ -n "$spinel" ]; then
            printf '%s' "$spinel" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z._-]*$' || { echo "::error::spinel_tag $SPINEL_INPUT is not a tag name"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "spinel=$spinel" >> "$GITHUB_OUTPUT"

      - name: The version has no tag yet
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi

      - name: The Spinel tag exists in Cybertrain::SPINEL_REPOSITORY
        if: steps.inputs.outputs.spinel != ''
        env:
          SPINEL: ${{ steps.inputs.outputs.spinel }}
        run: |
          repo=$(sed -n 's/^ *SPINEL_REPOSITORY = "\([^"]*\)".*/\1/p' cybertrain/version.rb | head -n 1)
          test -n "$repo" || { echo "::error::no SPINEL_REPOSITORY in cybertrain/version.rb"; exit 1; }
          git ls-remote --exit-code --tags "$repo" "refs/tags/$SPINEL" > /dev/null \
            || { echo "::error::$repo has no tag $SPINEL"; exit 1; }

      - name: Move the numbers
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
          SPINEL: ${{ steps.inputs.outputs.spinel }}
        run: |
          ruby script/bump-version "$VERSION" "$SPINEL"
          git diff --stat

      # The same pins script/gate checks, so a pull request that would fail the
      # Gate on them is never opened.
      - name: The pins agree
        run: |
          ruby -e '
            v = File.read("cybertrain/version.rb")
            version = v[/^\s*VERSION = "([^"]+)"/, 1]
            spinel = v[/^\s*SPINEL_TAG = "([^"]+)"/, 1]
            spin = File.read("spin.toml")[/^version = "([^"]+)"/, 1]
            ci = File.read(".github/workflows/ci.yml")[/^\s*SPINEL_TAG: "([^"]+)"/, 1]
            abort "spin.toml #{spin} != #{version}" unless spin == version
            abort "ci.yml SPINEL_TAG #{ci} != #{spinel}" unless ci == spinel
            puts "cybertrain #{version}, spinel #{spinel}"
          '

      - name: Open the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          VERSION: ${{ steps.inputs.outputs.version }}
          BRANCH: release/bump-v${{ steps.inputs.outputs.version }}
        run: |
          spinel=$(sed -n 's/^ *SPINEL_TAG = "\([^"]*\)".*/\1/p' cybertrain/version.rb | head -n 1)
          old_spinel=$(git show HEAD:cybertrain/version.rb | sed -n 's/^ *SPINEL_TAG = "\([^"]*\)".*/\1/p' | head -n 1)
          old_version=$(git show HEAD:cybertrain/version.rb | sed -n 's/^ *VERSION = "\([^"]*\)".*/\1/p' | head -n 1)
          title="Bump to $VERSION"
          if [ "$spinel" != "$old_spinel" ]; then title="$title (Spinel $spinel)"; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -q -a -m "$title" -m "Moved by script/bump-version in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if ! git push --force origin "$BRANCH"; then
            echo "::error::RELEASE_PR_TOKEN could not push $BRANCH. It needs Contents: read and write, and Workflows: read and write when Spinel moves (the bump then changes .github/workflows/ci.yml)."
            exit 1
          fi

          checks="The Gate and CI run on this pull request (its branch was pushed with RELEASE_PR_TOKEN, and the run that opened it waits until both have started)."
          body="Moves main from cybertrain $old_version (Spinel $old_spinel) to cybertrain $VERSION (Spinel $spinel), with \`script/bump-version\`: \`cybertrain/version.rb\`, \`spin.toml\`, \`SPINEL_TAG\` in \`.github/workflows/ci.yml\` and the numbers the tests expect.

          $checks

          After merging, tag and push \`v$VERSION\` (CONTRIBUTING.md \"Releasing\", step 2). The site and the guides move in the release run.

          From $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."

          # A second run for the same version (say, with another Spinel tag)
          # moves the open pull request's title and body along with its branch.
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh pr edit "$open" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            echo "pull request #$open is already open; its branch, title and body are updated"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$title" --body "$body"
          fi

      # The reason RELEASE_PR_TOKEN is required, checked rather than assumed:
      # a pull_request run of each workflow exists for the pushed commit. Read
      # with GITHUB_TOKEN (actions: read), which the secret need not have.
      # A bump always changes cybertrain/version.rb, so CI's path filter
      # lets it through.
      - name: The Gate and CI started on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.pr.outputs.sha }}
          WORKFLOWS: gate.yml ci.yml
        run: |
          set -eu
          missing="$WORKFLOWS"
          for attempt in $(seq 1 18); do
            started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&event=pull_request&per_page=100" \
              --jq '.workflow_runs[].path' || true)
            missing=""
            for workflow in $WORKFLOWS; do
              printf '%s\n' "$started" | grep -qx ".github/workflows/$workflow" || missing="$missing $workflow"
            done
            if [ -z "$missing" ]; then
              echo "started on $SHA: $WORKFLOWS"
              exit 0
            fi
            sleep 10
          done
          echo "::error::the pull request is open, but no run of$missing started on $SHA within 3 minutes. Do not merge it unchecked: see the pull request's Checks tab, and close and reopen it to start them."
          exit 1
