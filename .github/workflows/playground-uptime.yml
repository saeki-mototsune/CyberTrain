# The hosted playground's outside check: every 30 minutes, GET
# <PLAYGROUND_URL>/status.json, retried twice 15 s apart; anything but the
# status JSON (no answer, an error, a redirect, an unrelated page) fails the
# run, and GitHub mails its usual failure notice. Off until the repository
# variable PLAYGROUND_URL is set (Settings -> Secrets and variables -> Actions
# -> Variables), for example https://<DOMAIN>. See playground/deploy/README.md.
name: Playground uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  status:
    if: vars.PLAYGROUND_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: status.json answers
        env:
          PLAYGROUND_URL: ${{ vars.PLAYGROUND_URL }}
        # -f fails on 4xx and 5xx, but a 3xx would pass: the body must be the
        # status JSON, which always names "accepting" (paused or full too).
        run: |
          body=$(curl -fsS --max-time 20 --retry 2 --retry-delay 15 --retry-all-errors "${PLAYGROUND_URL%/}/status.json")
          printf '%s\n' "$body"
          case "$body" in
            *'"accepting":'*) ;;
            *) echo "::error::${PLAYGROUND_URL%/}/status.json did not answer with the status JSON"; exit 1 ;;
          esac
