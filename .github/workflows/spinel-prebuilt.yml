# Prebuilt Spinel for Claude Code cloud sessions (script/claude-cloud-setup),
# attached to a cybertrain release.
#
# The Release workflow calls this after it creates the release vX.Y.Z. It
# builds the latest release of the saeki-mototsune fork of Spinel (or the
# tag given) in an ubuntu:24.04 container as root, which is what the cloud
# VM runs, and attaches the installed tree to vX.Y.Z as two assets:
#
#   spinel-<spinel tag>-linux-x86_64.tar.gz         the `make install`
#                                                    prefix, its symlinks
#                                                    made relative so it
#                                                    unpacks anywhere
#   spinel-<spinel tag>-linux-x86_64.tar.gz.sha256  its checksum
#
# The setup script fetches them from the latest cybertrain release
# (/releases/latest/download/...) and checks them, in seconds, instead of
# building Spinel from source (about four minutes); it builds from source
# when the latest release carries no build of the Spinel release it wants
# (the fork released again since).
#
# Run it by hand to attach a build to a release made before this workflow,
# or to rebuild one (the assets are replaced).
name: Spinel prebuilt

on:
  workflow_call:
    inputs:
      release:
        description: "cybertrain release (vX.Y.Z) to attach the build to"
        type: string
        required: true
      spinel-tag:
        description: "Spinel tag of the fork to build (default: its latest release)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      release:
        description: "cybertrain release (vX.Y.Z) to attach the build to"
        required: true
      spinel-tag:
        description: "Spinel tag of the fork to build (default: its latest release)"
        required: false
        default: ""

permissions:
  contents: write

env:
  SPINEL_GIT: https://github.com/saeki-mototsune/spinel.git
  RELEASE: ${{ inputs.release }}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container: ubuntu:24.04
    steps:
      - name: Install the build packages and gh
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential git curl ca-certificates ruby ruby-dev libsqlite3-dev zlib1g-dev libssl-dev sqlite3 > /dev/null
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gh > /dev/null

      - name: Check the release and pick the Spinel tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.spinel-tag }}
        run: |
          gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" > /dev/null \
            || { echo "no release $RELEASE in $GITHUB_REPOSITORY"; exit 1; }
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$(git ls-remote --tags --refs "$SPINEL_GIT" | sed 's#.*refs/tags/##' \
              | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$' | sort -V | tail -n 1)"
          fi
          test -n "$tag" || { echo "no release tag in $SPINEL_GIT"; exit 1; }
          echo "Spinel $tag for $RELEASE"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      # Spinel's build runs Ruby code generators (tools/gen_respond_to_tables.rb)
      # that `require "prism"`. Ubuntu 24.04's Ruby is 3.2, which does not
      # bundle prism, so the gem is installed at the Makefile's PRISM_VERSION,
      # as Spinel's own Dockerfile does (ruby-dev above builds its extension).
      - name: Build and install Spinel
        run: |
          prefix="/root/.cybertrain/spinel/$TAG"
          git clone -q --depth 1 --branch "$TAG" "$SPINEL_GIT" /tmp/spinel
          prism_version="$(sed -n 's/^PRISM_VERSION ?= *//p' /tmp/spinel/Makefile)"
          test -n "$prism_version" || { echo "no PRISM_VERSION in Spinel's Makefile"; exit 1; }
          gem install --no-document prism -v "$prism_version"
          make -C /tmp/spinel deps
          make -C /tmp/spinel -j"$(nproc)"
          make -C /tmp/spinel install PREFIX="$prefix"
          "$prefix/bin/spinel" --version | grep -q "^spinel $TAG ("

      # `make install` links bin/ to lib/ with absolute paths; relative
      # links let the tree be unpacked under any CYBERTRAIN_HOME.
      - name: Make the tree relocatable and smoke-test it from elsewhere
        run: |
          prefix="/root/.cybertrain/spinel/$TAG"
          cd "$prefix"
          find . -type l | while read -r link; do
            target="$(readlink "$link")"
            case "$target" in
              "$prefix"/*) ln -sfn "$(realpath -m --relative-to="$(dirname "$prefix/$link")" "$target")" "$link" ;;
            esac
          done
          if find . -type l -lname '/*' | grep -q .; then
            echo "absolute symlinks left:"; find . -type l -lname '/*'; exit 1
          fi
          mkdir -p /tmp/moved
          cp -a "$prefix" /tmp/moved/spinel
          mv "$prefix" "$prefix.hidden"
          printf 'puts "spinel #{[1, 2, 3].sum}"\n' > /tmp/smoke.rb
          /tmp/moved/spinel/bin/spinel /tmp/smoke.rb -o /tmp/smoke
          test "$(/tmp/smoke)" = "spinel 6"
          mv "$prefix.hidden" "$prefix"

      - name: Pack and attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/out
          asset="spinel-$TAG-linux-$(uname -m).tar.gz"
          tar -C "/root/.cybertrain/spinel" -czf "/tmp/out/$asset" "$TAG"
          (cd /tmp/out && sha256sum "$asset" > "$asset.sha256")
          ls -l /tmp/out
          gh release upload "$RELEASE" /tmp/out/* --repo "$GITHUB_REPOSITORY" --clobber
