# Creates the GitHub release for a tag vX.Y.Z, with notes GitHub generates
# from the pull requests merged since the previous tag. Runs on the tag push
# (CONTRIBUTING.md "Releasing", step 2); a manual run takes an existing tag, for a tag
# pushed before this workflow existed. A tag that already has a release fails
# the run rather than overwriting it.
#
# The release is created only when the tag passes every check first: the
# version check below, the Gate (gate.yml), the full test suite on Linux and
# macOS (ci.yml) and the blog image's build and smoke test (blog-image.yml),
# all run on the tagged commit. CI builds and tests against the Spinel release
# that commit pins (Cybertrain::SPINEL_TAG in cybertrain/version.rb), so a tag
# that moves to a new Spinel release is released only if everything passes on
# it. If any of them fails, no release is created; fix it, move or re-push the
# tag (or push a new one) and the checks run again.
#
# The version job resolves the tag to one commit, and every check and image
# build checks out that commit, not the tag: a tag moved while a run is going
# cannot make the jobs test different commits. Before the images are pushed
# and again before the release is created, the run checks that the tag still
# points to that commit, and stops if it does not (the run for the moved tag
# tests the new commit). A tag moved after the first check, while the images
# are being pushed, still stops the release, but the images built from the
# tested commit stay pushed; only a tag ruleset (a repository setting) keeps
# the tag from moving at all.
#
# Only once they have all passed does it build, smoke-test and push the
# playground image (playground-image.yml) and the blog image
# (blog-image.yml with release_tag), each as X.Y.Z and latest, and the
# release is created after both pushes succeed.
#
# After the release, for the newest release tag only, it opens a pull request
# that moves the version numbers the site and the guides name to this release
# (script/sync-versions; see the sync-site-versions job). Merging it deploys
# the site.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (vX.Y.Z)"
        required: true

# Each job below raises what it needs; the called workflows get read access only.
permissions:
  contents: read

# One release run per tag; a second run for the same tag waits for the first.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Resolve the tag to one commit
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: The tag is v + Cybertrain::VERSION
        run: |
          version=$(sed -n 's/^ *VERSION = "\([^"]*\)".*/\1/p' cybertrain/version.rb | head -n 1)
          test "$TAG" = "v$version" || { echo "tag $TAG is not v$version (cybertrain/version.rb)"; exit 1; }

      - name: The tag has no release yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $TAG already exists"; exit 1
          fi

  gate:
    needs: version
    uses: ./.github/workflows/gate.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  # A check only: blog-image.yml pushes nothing without release_tag.
  # (The workflow asks for packages: write for its release push.)
  blog-image:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/blog-image.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  # Between the checks and the first push: the tag still names what was tested.
  tag-unchanged:
    needs: [version, gate, ci, blog-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: The tag still points to the tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          now=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          test "$now" = "$SHA" || { echo "tag $TAG moved from $SHA to $now during this run; not publishing"; exit 1; }

  playground-image:
    needs: [version, tag-unchanged]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/playground-image.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      release_tag: ${{ inputs.tag || github.ref_name }}

  blog-image-push:
    needs: [version, tag-unchanged]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/blog-image.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      release_tag: ${{ inputs.tag || github.ref_name }}

  release:
    needs: [version, gate, ci, blog-image, tag-unchanged, playground-image, blog-image-push]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: The tag still points to the tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          now=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          test "$now" = "$SHA" || { echo "tag $TAG moved from $SHA to $now during this run; not publishing"; exit 1; }

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes

  # Once the release exists: a pull request against main that moves the version
  # numbers the site and the guides name (Cybertrain::VERSION and SPINEL_TAG)
  # from the previous release to this one, with script/sync-versions. Merging
  # it deploys the site (pages.yml). Only for the newest release tag, so that
  # releasing an older tag by hand does not move the site back. A second run
  # for the same tag updates the branch and leaves the open pull request as it
  # is. A pull request opened with GITHUB_TOKEN starts no workflows, so the
  # Gate and CI do not run on it; it only replaces numbers.
  # Needs Settings -> Actions -> General -> Workflow permissions -> "Allow
  # GitHub Actions to create and approve pull requests". When this job fails,
  # the release is already created: run script/sync-versions by hand.
  sync-site-versions:
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      BRANCH: release/sync-versions-${{ inputs.tag || github.ref_name }}
    steps:
      # All history and tags: the script reads cybertrain/version.rb at this
      # tag and at the one before it.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move the version numbers to this release
        id: sync
        run: |
          newest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$TAG" != "$newest" ]; then
            echo "$TAG is not the newest release tag ($newest); the site is left as it is"
            exit 0
          fi
          script/sync-versions "$TAG"
          if git diff --quiet; then
            echo "the site and the guides already name $TAG"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -q -a -m "Site and guides: name $TAG" -m "Moved by script/sync-versions in the release run for $TAG."
          git push --force origin "$BRANCH"
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            echo "pull request #$open is already open; its branch is updated"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "Site and guides: name $TAG" \
              --body "The release $TAG is published. This moves the version numbers the site and the guides name (Cybertrain::VERSION and Cybertrain::SPINEL_TAG) from the previous release to $TAG, with \`script/sync-versions\`. Merging it deploys the site.

          Opened by the release run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. The Gate and CI do not run on a pull request opened this way; check the diff, which only replaces numbers."
          fi
