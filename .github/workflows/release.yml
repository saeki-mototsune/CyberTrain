# Creates the GitHub release for a tag vX.Y.Z, with notes GitHub generates
# from the pull requests merged since the previous tag. Runs on the tag push
# (CONTRIBUTING.md "Releasing", step 2); a manual run releases an existing
# tag, for a tag pushed without a release: start it on the tag itself (Run
# workflow, "Use workflow from", Tags, vX.Y.Z). A manual run started on a
# branch is refused. A tag that already has a release fails the run rather
# than overwriting it.
#
# The tag is never an input. Every run, pushed or manual, runs in the tag's
# own context: the checks check out the commit the run started on
# (github.sha), and what they save to the Actions cache (the Spinel toolchain,
# the image layers) is scoped to the tag. A manual run on main that checked
# out a tag given as an input would run that commit's code with main's cache
# scope, and whatever it saved there (an unreviewed commit's toolchain, say)
# would be restored by every later run on main and on every pull request.
# It also means the tag's own copy of this workflow and of the ones it calls
# is the one that runs.
#
# The release is created only when the tag passes every check first: the
# version check below, the Gate (gate.yml), CI (ci.yml: the full test suite
# on Linux, and on macOS the OS-sensitive test programs and one end-to-end
# leg) and the two images' builds and smoke tests (blog-image.yml and
# playground-image.yml), all run on the tagged commit. CI builds and tests against the Spinel release
# that commit pins (Cybertrain::SPINEL_TAG in cybertrain/version.rb), so a tag
# that moves to a new Spinel release is released only if everything passes on
# it. If any of them fails, no release is created; fix it, move or re-push the
# tag (or push a new one) and the checks run again.
#
# Every check and image build checks out the commit the run started on
# (github.sha, which the version job also outputs as `sha`), not the tag: a
# tag moved while a run is going cannot make the jobs test different commits.
# Before the images are pushed and again before the release is created, the
# run checks that the tag still points to that commit, and stops if it does
# not (the run for the moved tag tests the new commit). A tag moved after the first check, while the images
# are being pushed, still stops the release, but the images built from the
# tested commit stay pushed; only a tag ruleset (a repository setting) keeps
# the tag from moving at all.
#
# The order, after the version job: the checks (gate, ci, blog-image,
# playground-image) and the Spinel prebuilt's build all start at once, so
# the run waits for the longest of them (CI) rather than for their sum; then
# tag-unchanged; then the two pushes; then the release; then promote-latest
# and the prebuilt's attachment to the release.
#
# Only once every check has passed does it push the two images, each as
# X.Y.Z, and neither is built again: each is the very image its check
# built and smoke-tested, handed over as a workflow artifact and checked by
# its image ID before it is pushed (playground-image-push, blog-image-push).
# The builds themselves push nothing and run with a read-only token. The
# release is created after both pushes succeed.
#
# latest is moved last, by promote-latest, for both images in one job: to
# the newest release there is (the highest X.Y.Z with a published release),
# not to this run's tag. Runs for different tags go on in parallel, and a
# manual run may release an old tag; whichever run comes last, in whatever
# order, latest ends on the newest release, and on the same one for both
# images. Nothing else pushes latest.
#
# spinel-prebuilt.yml builds a Linux build of the latest Spinel release of
# the fork, for Claude Code cloud sessions (script/claude-cloud-setup
# downloads it from the latest release), beside the checks; it is not one of
# them, and spinel-prebuilt-attach attaches it once the release is created.
name: Release

on:
  push:
    tags: ["v*"]
  # On the tag to release (see above): no inputs.
  workflow_dispatch:

# Each job below raises what it needs; the called workflows get read access only.
permissions:
  contents: read

# One release run per tag; a second run for the same tag waits for the first.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: The run is on a tag
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "::error::$REF is not a tag vX.Y.Z: start a manual run on the tag (Use workflow from, Tags)"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The commit the run started on
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: The tag is v + Cybertrain::VERSION
        run: |
          version=$(sed -n 's/^ *VERSION = "\([^"]*\)".*/\1/p' cybertrain/version.rb | head -n 1)
          test "$TAG" = "v$version" || { echo "tag $TAG is not v$version (cybertrain/version.rb)"; exit 1; }

      - name: The tag has no release yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $TAG already exists"; exit 1
          fi

  # The called workflows check out github.sha, the commit the version job
  # checked: they take no ref (see the top of this file).
  gate:
    needs: version
    uses: ./.github/workflows/gate.yml

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  # A check only: blog-image.yml pushes nothing. It saves the image that
  # passed the smoke test as the artifact blog-image-tested, which
  # blog-image-push publishes once every check has passed.
  blog-image:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/blog-image.yml
    with:
      artifact: blog-image-tested

  # A check too, and likewise pushes nothing: with `push: false` the called
  # workflow's push job does not run, and its image job (which keeps that
  # workflow's read-only token) saves the image that passed the smoke test
  # as the artifact playground-image-tested, which playground-image-push
  # publishes once every check has passed. packages: write is granted only
  # because GitHub checks every job of a called workflow against the
  # caller's grant before any `if:`, the skipped push job included; no job
  # that runs here gets it.
  playground-image:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/playground-image.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      release_tag: ${{ github.ref_name }}
      push: false

  # Between the checks and the first push: the tag still names what was tested.
  tag-unchanged:
    needs: [version, gate, ci, blog-image, playground-image]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: The tag still points to the tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          now=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          test "$now" = "$SHA" || { echo "tag $TAG moved from $SHA to $now during this run; not publishing"; exit 1; }

  # Publishes the image the playground-image check tested, as blog-image-push
  # does the blog's: loads its artifact, checks that it is that image (the ID
  # the check recorded) and pushes it under the tags the check computed
  # (X.Y.Z). No build here, so nothing untested can be pushed.
  playground-image-push:
    needs: [version, playground-image, tag-unchanged]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/saeki-mototsune/cybertrain-playground
      IMAGE_ID: ${{ needs.playground-image.outputs.image_id }}
      TAGS: ${{ needs.playground-image.outputs.tags }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playground-image-tested

      - name: Load the tested image
        run: |
          set -eu
          test -n "$IMAGE_ID" || { echo "::error::the playground-image check recorded no image ID"; exit 1; }
          gunzip -c playground-image.tar.gz | docker load
          got=$(docker image inspect cybertrain-playground:ci --format '{{.Id}}')
          test "$got" = "$IMAGE_ID" || { echo "::error::the artifact holds image $got, the check tested $IMAGE_ID; not pushing"; exit 1; }
          echo "loaded $got, the image the check tested"

      # promote-latest copies $IMAGE:X.Y.Z to latest: it must be among them.
      - name: Push the tested image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="${TAG#v}"
          found=false
          for tag in $TAGS; do
            if [ "$tag" = "$IMAGE:$version" ]; then found=true; fi
          done
          "$found" || { echo "::error::the tags to push ($TAGS) do not include $IMAGE:$version"; exit 1; }
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for tag in $TAGS; do
            docker tag cybertrain-playground:ci "$tag"
            docker push "$tag"
          done

  # Publishes the image the blog-image check tested: loads its artifact,
  # checks that it is that image (the ID the check recorded) and pushes it as
  # X.Y.Z. No build here, so nothing untested can be pushed; no artifact (the
  # check failed, or it expired after 7 days: re-run the whole workflow)
  # stops the job.
  blog-image-push:
    needs: [version, blog-image, tag-unchanged]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/saeki-mototsune/cybertrain-blog
      IMAGE_ID: ${{ needs.blog-image.outputs.image_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: blog-image-tested

      - name: Load the tested image
        run: |
          set -eu
          test -n "$IMAGE_ID" || { echo "::error::the blog-image check recorded no image ID"; exit 1; }
          gunzip -c blog-image.tar.gz | docker load
          got=$(docker image inspect blog:ci --format '{{.Id}}')
          test "$got" = "$IMAGE_ID" || { echo "::error::the artifact holds image $got, the check tested $IMAGE_ID; not pushing"; exit 1; }
          echo "loaded $got, the image the check tested"

      - name: Push the tested image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="${TAG#v}"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag blog:ci "$IMAGE:$version"
          docker push "$IMAGE:$version"

  release:
    needs: [version, gate, ci, blog-image, playground-image, tag-unchanged, playground-image-push, blog-image-push]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: The tag still points to the tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          now=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          test "$now" = "$SHA" || { echo "tag $TAG moved from $SHA to $now during this run; not publishing"; exit 1; }

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes

  # Points latest of both images at the newest release: the highest X.Y.Z
  # among the published releases (drafts and prereleases apart), which is
  # this run's tag unless a newer one was released first, or this run is a
  # manual release of an old tag. It retags in the registry (the manifest
  # X.Y.Z names, not a rebuild) and checks that the two digests are equal.
  # One at a time across all release runs (the group below). GitHub keeps one
  # waiting job per group and cancels an older waiting one, which is harmless
  # here: every run moves latest to the same place, and the one that runs
  # last has seen every release. Re-run this job to repair latest by hand.
  # Both X.Y.Z tags it reads are pushed by the two push jobs, which release
  # already needs; they are named here as what this job relies on.
  promote-latest:
    needs: [release, playground-image-push, blog-image-push]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-promote-latest
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
      IMAGES: ghcr.io/saeki-mototsune/cybertrain-playground ghcr.io/saeki-mototsune/cybertrain-blog
    steps:
      - name: Find the newest release
        id: newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select((.draft or .prerelease) | not) | .tag_name' > releases.txt
          newest=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' releases.txt | sort -V | tail -n 1)
          test -n "$newest" || { echo "::error::no published release vX.Y.Z found"; exit 1; }
          if [ "$newest" = "$TAG" ]; then
            echo "$TAG is the newest release: latest moves to it"
          else
            echo "::notice::$TAG is not the newest release ($newest is): latest goes to $newest, not to $TAG"
          fi
          echo "tag=$newest" >> "$GITHUB_OUTPUT"

      - name: Point latest at the newest release (both images)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWEST: ${{ steps.newest.outputs.tag }}
        run: |
          set -eu
          version="${NEWEST#v}"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          digest() { docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}'; }
          # Both versions must be there before either latest moves.
          for image in $IMAGES; do
            digest "$image:$version" > /dev/null || { echo "::error::$image:$version is not in the registry; latest is left alone"; exit 1; }
          done
          for image in $IMAGES; do
            # --prefer-index=false: the same manifest under another tag, not
            # an index wrapped around it.
            docker buildx imagetools create --prefer-index=false --tag "$image:latest" "$image:$version"
            want=$(digest "$image:$version")
            got=$(digest "$image:latest")
            test "$got" = "$want" || { echo "::error::$image:latest is $got, not $want ($version)"; exit 1; }
            echo "$image:latest -> $version ($got)"
          done

  # Spinel prebuilt for Claude Code cloud sessions (script/claude-cloud-setup
  # downloads it from the latest release): built beside the checks with
  # `attach: false`, which uploads it as the artifact spinel-prebuilt and
  # skips the called workflow's attach job, then attached by
  # spinel-prebuilt-attach once the release exists. Not a check: the release
  # does not wait for it. contents: write is granted only because GitHub
  # checks every job of a called workflow against the caller's grant before
  # any `if:`, the skipped attach job included; the build job that runs
  # keeps a read-only token.
  spinel-prebuilt:
    needs: version
    permissions:
      contents: write
    uses: ./.github/workflows/spinel-prebuilt.yml
    with:
      release: ${{ github.ref_name }}
      attach: false

  spinel-prebuilt-attach:
    needs: [spinel-prebuilt, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spinel-prebuilt
          path: out

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l out
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
