# Creates the GitHub release for a tag vX.Y.Z, with notes GitHub generates
# from the pull requests merged since the previous tag. Runs on the tag push
# (CONTRIBUTING.md "Releasing", step 2); a manual run takes an existing tag, for a tag
# pushed before this workflow existed. A tag that already has a release fails
# the run rather than overwriting it.
#
# The release is created only when the tag passes every check first: the
# version check below, the Gate (gate.yml), the full test suite on Linux and
# macOS (ci.yml) and the blog image's build and smoke test (blog-image.yml),
# all run on the tagged commit. CI builds and tests against the Spinel release
# that commit pins (Cybertrain::SPINEL_TAG in cybertrain/version.rb), so a tag
# that moves to a new Spinel release is released only if everything passes on
# it. If any of them fails, no release is created; fix it, move or re-push the
# tag (or push a new one) and the checks run again.
#
# The version job resolves the tag to one commit, and every check and image
# build checks out that commit, not the tag: a tag moved while a run is going
# cannot make the jobs test different commits. Before the images are pushed
# and again before the release is created, the run checks that the tag still
# points to that commit, and stops if it does not (the run for the moved tag
# tests the new commit). A tag moved after the first check, while the images
# are being pushed, still stops the release, but the images built from the
# tested commit stay pushed; only a tag ruleset (a repository setting) keeps
# the tag from moving at all.
#
# Only once they have all passed does it build, smoke-test and push the
# playground image (playground-image.yml) and the blog image
# (blog-image.yml with release_tag), each as X.Y.Z, and the release is
# created after both pushes succeed.
#
# latest is moved last, by promote-latest, for both images in one job: to
# the newest release there is (the highest X.Y.Z with a published release),
# not to this run's tag. Runs for different tags go on in parallel, and a
# manual run may release an old tag; whichever run comes last, in whatever
# order, latest ends on the newest release, and on the same one for both
# images. Nothing else pushes latest.
#
# After the release is created, spinel-prebuilt.yml attaches a Linux build of
# the latest Spinel release of the fork, for Claude Code cloud sessions
# (script/claude-cloud-setup downloads it from the latest release).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (vX.Y.Z)"
        required: true

# Each job below raises what it needs; the called workflows get read access only.
permissions:
  contents: read

# One release run per tag; a second run for the same tag waits for the first.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Resolve the tag to one commit
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: The tag is v + Cybertrain::VERSION
        run: |
          version=$(sed -n 's/^ *VERSION = "\([^"]*\)".*/\1/p' cybertrain/version.rb | head -n 1)
          test "$TAG" = "v$version" || { echo "tag $TAG is not v$version (cybertrain/version.rb)"; exit 1; }

      - name: The tag has no release yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $TAG already exists"; exit 1
          fi

  gate:
    needs: version
    uses: ./.github/workflows/gate.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  # A check only: blog-image.yml pushes nothing without release_tag.
  # (The workflow asks for packages: write for its release push.)
  blog-image:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/blog-image.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  # Between the checks and the first push: the tag still names what was tested.
  tag-unchanged:
    needs: [version, gate, ci, blog-image]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: The tag still points to the tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          now=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          test "$now" = "$SHA" || { echo "tag $TAG moved from $SHA to $now during this run; not publishing"; exit 1; }

  playground-image:
    needs: [version, tag-unchanged]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/playground-image.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      release_tag: ${{ inputs.tag || github.ref_name }}

  blog-image-push:
    needs: [version, tag-unchanged]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/blog-image.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      release_tag: ${{ inputs.tag || github.ref_name }}

  release:
    needs: [version, gate, ci, blog-image, tag-unchanged, playground-image, blog-image-push]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: The tag still points to the tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          now=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          test "$now" = "$SHA" || { echo "tag $TAG moved from $SHA to $now during this run; not publishing"; exit 1; }

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes

  # Points latest of both images at the newest release: the highest X.Y.Z
  # among the published releases (drafts and prereleases apart), which is
  # this run's tag unless a newer one was released first, or this run is a
  # manual release of an old tag. It retags in the registry (the manifest
  # X.Y.Z names, not a rebuild) and checks that the two digests are equal.
  # One at a time across all release runs (the group below). GitHub keeps one
  # waiting job per group and cancels an older waiting one, which is harmless
  # here: every run moves latest to the same place, and the one that runs
  # last has seen every release. Re-run this job to repair latest by hand.
  promote-latest:
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-promote-latest
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      IMAGES: ghcr.io/saeki-mototsune/cybertrain-playground ghcr.io/saeki-mototsune/cybertrain-blog
    steps:
      - name: Find the newest release
        id: newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select((.draft or .prerelease) | not) | .tag_name' > releases.txt
          newest=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' releases.txt | sort -V | tail -n 1)
          test -n "$newest" || { echo "::error::no published release vX.Y.Z found"; exit 1; }
          if [ "$newest" = "$TAG" ]; then
            echo "$TAG is the newest release: latest moves to it"
          else
            echo "::notice::$TAG is not the newest release ($newest is): latest goes to $newest, not to $TAG"
          fi
          echo "tag=$newest" >> "$GITHUB_OUTPUT"

      - name: Point latest at the newest release (both images)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWEST: ${{ steps.newest.outputs.tag }}
        run: |
          set -eu
          version="${NEWEST#v}"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          digest() { docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}'; }
          # Both versions must be there before either latest moves.
          for image in $IMAGES; do
            digest "$image:$version" > /dev/null || { echo "::error::$image:$version is not in the registry; latest is left alone"; exit 1; }
          done
          for image in $IMAGES; do
            # --prefer-index=false: the same manifest under another tag, not
            # an index wrapped around it.
            docker buildx imagetools create --prefer-index=false --tag "$image:latest" "$image:$version"
            want=$(digest "$image:$version")
            got=$(digest "$image:latest")
            test "$got" = "$want" || { echo "::error::$image:latest is $got, not $want ($version)"; exit 1; }
            echo "$image:latest -> $version ($got)"
          done

  # Spinel prebuilt for Claude Code cloud sessions, attached to the release
  # just created (script/claude-cloud-setup downloads it from the latest one).
  spinel-prebuilt:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/spinel-prebuilt.yml
    with:
      release: ${{ inputs.tag || github.ref_name }}
