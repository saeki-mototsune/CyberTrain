# Builds examples/blog's production image (examples/blog/Dockerfile, the
# image `kamal deploy` ships; context: the repository root) for linux/amd64
# and smoke-tests it the way kamal-proxy and a visitor use it: migrations on
# boot, the /up.html health check, an article created through the form, a
# clean stop on SIGTERM and the database kept on its volume across
# containers. Also loads examples/blog/config/deploy.yml with Kamal. See
# examples/blog/README.md, "Deploying with Kamal".
# Pull requests, main and manual runs push nothing. release.yml calls this
# file twice for a tag vX.Y.Z: with `ref` as one of the checks, and, only
# after every check has passed, with `release_tag`, which also pushes the
# tested image to GHCR as X.Y.Z and latest.
name: Blog image

on:
  pull_request:
    paths:
      - "examples/blog/**"
      - "cybertrain/**"
      - "cybertrain.rb"
      - "cybertrain.gemspec"
      - "spin.toml"
      - "exe/**"
      - ".github/workflows/blog-image.yml"
  push:
    branches: [main]
    paths:
      - "examples/blog/**"
      - "cybertrain/**"
      - "cybertrain.rb"
      - "cybertrain.gemspec"
      - "spin.toml"
      - "exe/**"
      - ".github/workflows/blog-image.yml"
  workflow_dispatch:
  # release.yml runs this file on the tag before it creates a release.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (default: the commit that triggered the run)"
        type: string
        required: false
        default: ""
      release_tag:
        description: "Release tag vX.Y.Z to build, test and push as X.Y.Z and latest (default: push nothing)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: blog-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/saeki-mototsune/cybertrain-blog

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || (inputs.release_tag && format('refs/tags/{0}', inputs.release_tag)) || '' }}
          persist-credentials: false

      - name: The tag is v + Cybertrain::VERSION
        if: inputs.release_tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(sed -n 's/^ *VERSION = "\([^"]*\)".*/\1/p' cybertrain/version.rb | head -n 1)
          test "$RELEASE_TAG" = "v$version" || { echo "tag $RELEASE_TAG is not v$version (cybertrain/version.rb)"; exit 1; }

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # The same check `kamal deploy` makes before it builds: the file loads
      # and passes Kamal's validation. The secrets only need to be set.
      - name: config/deploy.yml loads with Kamal
        working-directory: examples/blog
        env:
          KAMAL_REGISTRY_PASSWORD: unused
          CYBERTRAIN_SECRET_KEY_BASE: unused
        run: |
          gem install kamal -v "~> 2.0" --no-document
          kamal config > /dev/null

      - uses: docker/setup-buildx-action@v3

      - name: Build (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/blog/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: blog:ci
          cache-from: type=gha,scope=blog-image
          cache-to: type=gha,mode=max,scope=blog-image,ignore-error=true

      - name: Smoke test
        run: |
          set -eu
          secret=$(openssl rand -hex 32)
          start() {
            docker run -d --name blog -p 127.0.0.1:3000:3000 -e CYBERTRAIN_SECRET_KEY_BASE="$secret" \
              -v blog_storage:/app/storage blog:ci > /dev/null
            for i in $(seq 1 40); do curl -fs -o /dev/null http://127.0.0.1:3000/up.html && return 0; sleep 0.5; done
            docker logs blog; return 1
          }
          start
          docker logs blog | grep -q "production environment"
          test "$(docker exec blog id -u)" != 0
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          curl -fsS -o /dev/null http://127.0.0.1:3000/style.css

          # An article through the form: the CSRF token from the page, the
          # session cookie (Secure, so passed by hand over http) with it.
          curl -fsS -D headers -o page.html http://127.0.0.1:3000/articles/new
          token=$(grep -o 'name="authenticity_token" value="[^"]*"' page.html | head -n 1 | sed 's/.*value="//; s/"$//')
          cookie=$(grep -i '^set-cookie:' headers | head -n 1 | sed 's/^[^:]*: //; s/;.*//' | tr -d '\r')
          test -n "$token" && test -n "$cookie"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Cookie: $cookie" \
            --data-urlencode "authenticity_token=$token" \
            --data-urlencode "article[title]=Smoke test" \
            --data-urlencode "article[body]=Created by the Blog image workflow." \
            http://127.0.0.1:3000/articles)
          test "$status" = 303 || { echo "POST /articles answered $status"; docker logs blog; exit 1; }

          # SIGTERM: the server drains and exits 0 well inside docker stop's 10 s.
          docker stop blog > /dev/null
          test "$(docker inspect blog --format '{{.State.ExitCode}}')" = 0 || { docker logs blog; exit 1; }
          docker rm blog > /dev/null

          # A new container on the same volume still has the article.
          start
          curl -fsS http://127.0.0.1:3000/ | grep -q "Smoke test"
          docker exec blog ./blog db status | grep -q "up"
          docker rm -f blog > /dev/null
          echo "smoke: ok"

      - name: Log in to GHCR
        if: inputs.release_tag
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image
        if: inputs.release_tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          for tag in "$version" latest; do
            docker tag blog:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
