# Builds examples/blog's production image (examples/blog/Dockerfile, the
# image `kamal deploy` ships; context: the repository root) for linux/amd64
# and smoke-tests it the way kamal-proxy and a visitor use it: migrations on
# boot, the /up.html health check, an article created through the form, a
# clean stop on SIGTERM and the database kept on its volume across
# containers. Also loads examples/blog/config/deploy.yml with Kamal. See
# examples/blog/README.md, "Deploying with Kamal".
# It pushes nothing. It runs from release.yml, by hand (Actions -> Blog
# image -> Run workflow), and on a pull request that touches what the image
# is built with (below): the app, and the CLI, the
# toolchain checks, the pins and the gemspec, since the build runs
# `cybertrain setup` and `cybertrain build` on this image's package list. A
# change to the rest of the framework alone is tested by ci.yml and reaches
# the image at the next release. Pushes to main do not run it.
# release.yml calls it once for a tag vX.Y.Z, as one of the checks, with
# `artifact`: the image that passed the smoke test is then saved (docker
# save) as a workflow artifact of that name, and its image ID is this
# workflow's output. Once every check has passed, release.yml loads that
# artifact and pushes it to GHCR as X.Y.Z (its blog-image-push job): the
# image published is the one tested here, not a second build.
name: Blog image

on:
  pull_request:
    paths:
      - "examples/blog/**"
      - ".github/workflows/blog-image.yml"
      # The CLI that builds the image (cybertrain.gemspec's spec.files) and
      # the pins: the version and the Spinel release in
      # cybertrain/version.rb, the packages in spin.toml.
      - "cybertrain.gemspec"
      - "spin.toml"
      - "exe/**"
      - "cybertrain/cli.rb"
      - "cybertrain/cli/**"
      - "cybertrain/version.rb"
      - "cybertrain/app_name.rb"
      - "cybertrain/shell.rb"
      - "cybertrain/test_files.rb"
      - "cybertrain/test/args.rb"
      - "cybertrain/ident.rb"
      - "cybertrain/crypto.rb"
      - "cybertrain/generator/inflector.rb"
  workflow_dispatch:
  # release.yml runs this file on the tag before it creates a release.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (default: the commit that triggered the run)"
        type: string
        required: false
        default: ""
      artifact:
        description: "Save the tested image as a workflow artifact of this name (default: do not save it)"
        type: string
        required: false
        default: ""
    outputs:
      image_id:
        description: "ID (docker image inspect) of the tested image saved in the artifact; empty without `artifact`"
        value: ${{ jobs.image.outputs.image_id }}

# Builds and tests only: nothing here pushes (release.yml's blog-image-push
# publishes the tested artifact), so the token is read-only.
permissions:
  contents: read

concurrency:
  group: blog-image-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      image_id: ${{ steps.save.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"

      # The same check `kamal deploy` makes before it builds: the file loads
      # and passes Kamal's validation. The secrets only need to be set.
      - name: config/deploy.yml loads with Kamal
        working-directory: examples/blog
        env:
          KAMAL_REGISTRY_PASSWORD: unused
          CYBERTRAIN_SECRET_KEY_BASE: unused
        run: |
          gem install kamal -v "~> 2.0" --no-document
          kamal config > /dev/null

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: examples/blog/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: blog:ci
          cache-from: type=gha,scope=blog-image
          cache-to: type=gha,mode=max,scope=blog-image,ignore-error=true

      - name: Smoke test
        run: |
          set -eu
          secret=$(openssl rand -hex 32)
          start() {
            docker run -d --name blog -p 127.0.0.1:3000:3000 -e CYBERTRAIN_SECRET_KEY_BASE="$secret" \
              -v blog_storage:/app/storage blog:ci > /dev/null
            for i in $(seq 1 40); do curl -fs -o /dev/null http://127.0.0.1:3000/up.html && return 0; sleep 0.5; done
            docker logs blog; return 1
          }
          start
          docker logs blog | grep -q "production environment"
          test "$(docker exec blog id -u)" != 0
          # The layout links the digested stylesheet; it must answer with the immutable header.
          css=$(curl -fsS http://127.0.0.1:3000/ | grep -o '/assets/application-[0-9a-f]\{8\}\.css' | head -1)
          test -n "$css"
          curl -fsS -D css.h -o /dev/null "http://127.0.0.1:3000$css"
          grep -qi '^cache-control:.*immutable' css.h

          # The pages in Japanese for a browser that asks for it.
          curl -fsS -H "Accept-Language: ja" http://127.0.0.1:3000/ | grep -q '<html lang="ja">'

          # Writing needs a user: one made with the user command, signed in
          # through the form. The CSRF token from the page, the session
          # cookie (Secure, so passed by hand over http) with it; signing in
          # sends a new cookie.
          docker exec blog ./blog user smoke@example.com smoke-test-password | grep -q "created smoke@example.com"
          curl -fsS -D headers -o page.html http://127.0.0.1:3000/session/new
          token=$(grep -o 'name="authenticity_token" value="[^"]*"' page.html | head -n 1 | sed 's/.*value="//; s/"$//')
          cookie=$(grep -i '^set-cookie:' headers | head -n 1 | sed 's/^[^:]*: //; s/;.*//' | tr -d '\r')
          test -n "$token" && test -n "$cookie"
          status=$(curl -sS -D headers -o /dev/null -w '%{http_code}' -H "Cookie: $cookie" \
            --data-urlencode "authenticity_token=$token" \
            --data-urlencode "email_address=smoke@example.com" \
            --data-urlencode "password=smoke-test-password" \
            http://127.0.0.1:3000/session)
          test "$status" = 303 || { echo "POST /session answered $status"; docker logs blog; exit 1; }
          cookie=$(grep -i '^set-cookie:' headers | head -n 1 | sed 's/^[^:]*: //; s/;.*//' | tr -d '\r')
          test -n "$cookie"

          # An article through the form, signed in.
          curl -fsS -H "Cookie: $cookie" -o page.html http://127.0.0.1:3000/articles/new
          grep -q '<h1>New article</h1>' page.html || { echo "GET /articles/new is not the form"; exit 1; }
          token=$(grep -o 'name="authenticity_token" value="[^"]*"' page.html | head -n 1 | sed 's/.*value="//; s/"$//')
          test -n "$token"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Cookie: $cookie" \
            --data-urlencode "authenticity_token=$token" \
            --data-urlencode "article[title]=Smoke test" \
            --data-urlencode "article[body]=Created by the Blog image workflow." \
            http://127.0.0.1:3000/articles)
          test "$status" = 303 || { echo "POST /articles answered $status"; docker logs blog; exit 1; }

          # SIGTERM: the server drains and exits 0 well inside docker stop's 10 s.
          docker stop blog > /dev/null
          test "$(docker inspect blog --format '{{.State.ExitCode}}')" = 0 || { docker logs blog; exit 1; }
          docker rm blog > /dev/null

          # A new container on the same volume still has the article.
          start
          curl -fsS http://127.0.0.1:3000/ | grep -q "Smoke test"
          docker exec blog ./blog db status | grep -q "up"
          docker rm -f blog > /dev/null
          echo "smoke: ok"

      # After the smoke test, so the artifact exists only for an image that
      # passed it. The ID names the image's content: release.yml compares it
      # after docker load, before it pushes.
      - name: Save the tested image
        id: save
        if: inputs.artifact
        run: |
          set -eu
          docker save blog:ci | gzip > blog-image.tar.gz
          echo "image_id=$(docker image inspect blog:ci --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          ls -l blog-image.tar.gz

      # overwrite: a re-run of this job replaces the artifact of the attempt
      # before it. Already gzipped, so stored as it is.
      - name: Upload the tested image
        if: inputs.artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact }}
          path: blog-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7
