name: CI

# A change that touches only documentation runs no tests: site/ (the
# homepage, the tutorial and the playground page: static files that nothing
# below reads; pages.yml publishes it) and Markdown files anywhere. The
# exceptions are the API reference's Markdown sources (docs/api/README.md,
# docs/template-language.md; see .yardopts), which the "API reference builds"
# step below checks. A change that also touches anything else runs the tests.
# `paths` with negations rather than `paths-ignore`, since only `paths` can
# bring the API reference's files back in (a later pattern wins).
on:
  push:
    paths:
      - "**"
      - "!site/**"
      - "!**.md"
      - "docs/api/**"
      - "docs/template-language.md"
  pull_request:
    paths:
      - "**"
      - "!site/**"
      - "!**.md"
      - "docs/api/**"
      - "docs/template-language.md"

env:
  # Must equal Cybertrain::SPINEL_TAG (script/gate checks, in the Gate
  # workflow): the release the CLI installs and the framework is tested against.
  SPINEL_TAG: "2026.09.12"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install SQLite headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev zlib1g-dev libssl-dev

      # Spinel's openssl package links `-lssl -lcrypto` with no search path;
      # Homebrew's OpenSSL is keg-only, so a program that requires openssl
      # (test/openssl_dispatch.rb) finds it through the compiler's
      # LIBRARY_PATH / CPATH.
      - name: Point the compiler at Homebrew's OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          prefix="$(brew --prefix openssl@3)"
          echo "LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          echo "CPATH=$prefix/include" >> "$GITHUB_ENV"

      # The version pins, script/check-reserved-names, check-client-faults and
      # check-http-layer run in the Gate workflow (script/gate), on every change.

      # The API reference (YARD, published with the site) must build without
      # a warning: an unknown tag or a {Link} to nothing fails it.
      - name: API reference builds
        if: runner.os == 'Linux'
        run: |
          gem install --no-document yard kramdown kramdown-parser-gfm
          script/api-docs

      # The gem ships the CLI only; it must run under CRuby and bring every
      # file it requires (cybertrain.gemspec lists them by hand).
      - name: Build and install the gem
        run: |
          gem build cybertrain.gemspec --output /tmp/cybertrain.gem
          gem install --local --no-document /tmp/cybertrain.gem
          cybertrain version

      # The key names the runner image too: a toolchain built on one image
      # is not assumed to run on the next. ImageOS and ImageVersion are
      # variables of the runner process, not of the expression context, so
      # a step copies them into an output first.
      - name: Name the runner image
        id: image
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-0}" >> "$GITHUB_OUTPUT"

      - name: Restore the Spinel toolchain
        id: spinel-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cybertrain/spinel
          key: spinel-${{ env.SPINEL_TAG }}-${{ runner.os }}-${{ steps.image.outputs.id }}-${{ runner.arch }}-v3

      # `cybertrain setup` is how users get Spinel, so CI gets it the same
      # way: a cache miss builds the release, a hit verifies it.
      - name: Install Spinel with cybertrain setup
        run: |
          cybertrain doctor
          cybertrain setup
          echo "$HOME/.cybertrain/bin" >> "$GITHUB_PATH"

      # Saved right after the build, so a failure later in the job does not
      # cost the next run another build.
      - name: Save the Spinel toolchain
        if: steps.spinel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cybertrain/spinel
          key: ${{ steps.spinel-cache.outputs.cache-primary-key }}

      - name: Framework tests
        run: |
          spinel --version
          spin test

      - name: Gem CLI scaffolds an app, migrates, builds dist/ and serves it
        run: |
          mkdir -p /tmp/gem-e2e && cd /tmp/gem-e2e
          cybertrain new shop --path "$GITHUB_WORKSPACE"
          cd shop
          test -f spin.lock
          cybertrain generate scaffold product name:string price:integer
          cybertrain generate authentication
          cybertrain db migrate
          cybertrain db status
          cybertrain build
          cybertrain spin run gen -- --check
          test -x dist/shop
          # The generated app's own sign-up / sign-in test, compiled and run
          # from the binary (it links SQLite, so it has no CRuby snapshot).
          cybertrain spin test test/authentication.rb || true
          test -x build/test/authentication
          ./build/test/authentication
          cd dist && CYBERTRAIN_SECRET_KEY_BASE=ci-secret-ci-secret-ci-secret-ci-secret ./shop migrate
          CYBERTRAIN_SECRET_KEY_BASE=ci-secret-ci-secret-ci-secret-ci-secret PORT=3999 ./shop > server.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3999/session/new > /dev/null && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:3999/session/new | grep -q "Sign in"
          curl -fsS http://127.0.0.1:3999/sign_up | grep -q "Sign up"
          # Signed out, the scaffold is behind the sign-in page.
          test "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:3999/products)" = "303 http://127.0.0.1:3999/session/new"
          curl -fsS http://127.0.0.1:3999/style.css > /dev/null
          curl -fsS http://127.0.0.1:3999/up.html > /dev/null   # Kamal's health check (config/deploy.yml)
          grep -q "production environment" server.log
          kill %1

      # What `cybertrain new` does for users: the framework as a git
      # dependency that spin fetches and locks (here this checkout, at a
      # local tag, instead of the release tag).
      - name: Gem CLI resolves the framework as a git dependency
        run: |
          git -C "$GITHUB_WORKSPACE" tag -f ci-e2e HEAD
          mkdir -p /tmp/gem-e2e-git && cd /tmp/gem-e2e-git
          cybertrain new gitshop --git "file://$GITHUB_WORKSPACE" --ref ci-e2e
          cd gitshop
          grep -q 'ref = "ci-e2e"' spin.toml
          test -f spin.lock
          cybertrain generate scaffold item name:string
          cybertrain db migrate
          cybertrain spin run gen -- --check

      - name: Generated code is fresh (examples/blog)
        if: hashFiles('examples/blog/spin.toml') != ''
        run: |
          cd examples/blog
          spin run gen
          git diff --exit-code -- gen/

      - name: Example app tests
        if: hashFiles('examples/blog/spin.toml') != ''
        run: |
          cd examples/blog
          spin test
