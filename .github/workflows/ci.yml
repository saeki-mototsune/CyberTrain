name: CI

on:
  push:
  pull_request:

env:
  # Must equal Cybertrain::SPINEL_TAG (checked below): the release the CLI
  # installs and the framework is tested against.
  SPINEL_TAG: "2026.09.12"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install SQLite headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev

      - name: Version and Spinel tag are pinned in one place
        run: |
          version=$(ruby -I. -e 'require "cybertrain/version"; print Cybertrain::VERSION')
          grep -q "^version = \"$version\"$" spin.toml || { echo "spin.toml version != Cybertrain::VERSION ($version)"; exit 1; }
          tag=$(ruby -I. -e 'require "cybertrain/version"; print Cybertrain::SPINEL_TAG')
          test "$tag" = "$SPINEL_TAG" || { echo "Cybertrain::SPINEL_TAG ($tag) != CI SPINEL_TAG ($SPINEL_TAG)"; exit 1; }

      # Every method and ivar of Cybertrain::Model a column could be named
      # like must be in Ident::RESERVED_COLUMN_NAMES (the generator's and the
      # scaffold's reserved list), or a new Model method is shadowed silently.
      # Names the runner's Ruby adds to Object are advisory warnings only.
      - name: Reserved column names cover Cybertrain::Model
        run: ruby script/check-reserved-names

      # Every QueryInvalid subclass (and ParameterMissing) must be listed in
      # ClientError::CLIENT_FAULTS: the hierarchy is invisible under Spinel,
      # so an unlisted one would be a 500 there.
      - name: Client faults are all listed in ClientError
        run: ruby script/check-client-faults

      # cybertrain/http/* must load without Context, Middleware, Router and
      # the rest of the framework, so the HTTP layer can be lifted out whole.
      - name: HTTP layer does not depend on the framework
        run: ruby script/check-http-layer

      # The API reference (YARD, published with the site) must build without
      # a warning: an unknown tag or a {Link} to nothing fails it.
      - name: API reference builds
        if: runner.os == 'Linux'
        run: |
          gem install --no-document yard kramdown kramdown-parser-gfm
          script/api-docs

      # The gem ships the CLI only; it must run under CRuby and bring every
      # file it requires (cybertrain.gemspec lists them by hand).
      - name: Build and install the gem
        run: |
          gem build cybertrain.gemspec --output /tmp/cybertrain.gem
          gem install --local --no-document /tmp/cybertrain.gem
          cybertrain version

      # The key names the runner image too: a toolchain built on one image
      # is not assumed to run on the next. ImageOS and ImageVersion are
      # variables of the runner process, not of the expression context, so
      # a step copies them into an output first.
      - name: Name the runner image
        id: image
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-0}" >> "$GITHUB_OUTPUT"

      - name: Restore the Spinel toolchain
        id: spinel-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cybertrain/spinel
          key: spinel-${{ env.SPINEL_TAG }}-${{ runner.os }}-${{ steps.image.outputs.id }}-${{ runner.arch }}-v3

      # `cybertrain setup` is how users get Spinel, so CI gets it the same
      # way: a cache miss builds the release, a hit verifies it.
      - name: Install Spinel with cybertrain setup
        run: |
          cybertrain doctor
          cybertrain setup
          echo "$HOME/.cybertrain/bin" >> "$GITHUB_PATH"

      # Saved right after the build, so a failure later in the job does not
      # cost the next run another build.
      - name: Save the Spinel toolchain
        if: steps.spinel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cybertrain/spinel
          key: ${{ steps.spinel-cache.outputs.cache-primary-key }}

      - name: Framework tests
        run: |
          spinel --version
          spin test

      - name: Gem CLI scaffolds an app, migrates, builds dist/ and serves it
        run: |
          mkdir -p /tmp/gem-e2e && cd /tmp/gem-e2e
          cybertrain new shop --path "$GITHUB_WORKSPACE"
          cd shop
          test -f spin.lock
          cybertrain generate scaffold product name:string price:integer
          cybertrain db migrate
          cybertrain db status
          cybertrain build
          cybertrain spin run gen -- --check
          test -x dist/shop
          cd dist && CYBERTRAIN_SECRET_KEY_BASE=ci-secret-ci-secret-ci-secret-ci-secret ./shop migrate
          CYBERTRAIN_SECRET_KEY_BASE=ci-secret-ci-secret-ci-secret-ci-secret PORT=3999 ./shop > server.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3999/products > /dev/null && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:3999/products > /dev/null
          curl -fsS http://127.0.0.1:3999/style.css > /dev/null
          grep -q "production environment" server.log
          kill %1

      # What `cybertrain new` does for users: the framework as a git
      # dependency that spin fetches and locks (here this checkout, at a
      # local tag, instead of the release tag).
      - name: Gem CLI resolves the framework as a git dependency
        run: |
          git -C "$GITHUB_WORKSPACE" tag -f ci-e2e HEAD
          mkdir -p /tmp/gem-e2e-git && cd /tmp/gem-e2e-git
          cybertrain new gitshop --git "file://$GITHUB_WORKSPACE" --ref ci-e2e
          cd gitshop
          grep -q 'ref = "ci-e2e"' spin.toml
          test -f spin.lock
          cybertrain generate scaffold item name:string
          cybertrain db migrate
          cybertrain spin run gen -- --check

      - name: Generated code is fresh (examples/blog)
        if: hashFiles('examples/blog/spin.toml') != ''
        run: |
          cd examples/blog
          spin run gen
          git diff --exit-code -- gen/

      - name: Example app tests
        if: hashFiles('examples/blog/spin.toml') != ''
        run: |
          cd examples/blog
          spin test
