# The blog's English texts: examples/blog's config/locales/en.yml with the
# keys in Rails' places (the comment partial's are comments.comment.*), and
# the sign-in texts examples/blog takes from CyberTrain's own dictionary.
en:
  activerecord:
    models:
      article: "Article"
      comment: "Comment"
    attributes:
      article:
        title: "Title"
        body: "Body"
        cover: "Cover"
      comment:
        commenter: "Commenter"
        body: "Body"
    errors:
      models:
        article:
          attributes:
            cover:
              too_large: "is too large (maximum is 2 MB)"
              content_type: "must be a PNG, JPEG, GIF or WebP image"
  layouts:
    application:
      title: "Blog"
      brand: "Blog"
      english: "English"
      japanese: "日本語"
  articles:
    index:
      title: "Articles"
      count:
        one: "%{number} article"
        other: "%{number} articles"
      from: "From"
      to: "To"
      order: "Order"
      newest_first: "Newest first"
      oldest_first: "Oldest first"
      filter: "Filter"
      article_title: "Title"
      body: "Body"
      comments: "Comments"
      show: "Show"
      new_article: "New article"
    new:
      title: "New article"
      back: "Back to articles"
    edit:
      title: "Editing article"
      show: "Show this article"
      back: "Back to articles"
    show:
      written: "Written"
      edit: "Edit"
      back: "Back to articles"
      destroy: "Destroy this article"
      manage: "Manage articles"
      comments: "Comments"
      add_comment: "Add a comment:"
    form:
      error_header:
        one: "1 error prohibited this article from being saved:"
        other: "%{count} errors prohibited this article from being saved:"
    create:
      created: "Article was successfully created."
    update:
      updated: "Article was successfully updated."
    destroy:
      destroyed: "Article was successfully destroyed."
  comments:
    comment:
      wrote_html: "%{author} wrote:"
      destroy: "Destroy comment"
    create:
      created: "Comment was successfully created."
      not_saved: "Comment could not be saved: %{errors}"
    destroy:
      destroyed: "Comment was successfully destroyed."
  sessions:
    create:
      invalid: "Try another email address or password."
      rate_limited: "Try again later."
    destroy:
      signed_out: "You have been signed out."
    nav:
      sign_in: "Sign in"
      sign_out: "Sign out"
    new:
      title: "Sign in"
      email_address: "Email address"
      password: "Password"
      submit: "Sign in"
      forgot_password: "Forgot your password?"
  admin:
    articles:
      index:
        title: "Admin: articles"
        count:
          one: "%{number} article"
          other: "%{number} articles"
        article_title: "Title"
        created: "Created"
        comments: "Comments"
        delete: "Delete"
        back: "Back to articles"
      destroy:
        deleted: "Article was successfully deleted."
