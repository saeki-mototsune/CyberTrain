# cybertrain: a Rails-like web application framework for the Spinel AOT compiler.
[package]
name = "cybertrain"
version = "0.4.2"

[dependencies]
# The HTTP layer (docs/design.md D91). The ref becomes "v0.1.0" (the same
# commit) once the maintainer pushes that tag; spin.lock pins the commit.
spinel-http = { git = "https://github.com/saeki-mototsune/spinel-http", ref = "release-0.1" }
